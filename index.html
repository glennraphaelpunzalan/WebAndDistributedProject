<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    />

    <title>Pokedex</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css" />

    <!-- JavaScript -->
    <script src="./pokemon.js" defer></script>
</head>

<body>

    <main class="main">

        <!-- HEADER -->
        <header class="header-home">

            <div class="container">

                <!-- LOGO -->
                <div class="logo-wrapper">

                    <img
                        src="./assets/pokeball.svg"
                        alt="pokeball"
                    />

                    <h1>Pokedex</h1>

                </div>

                <!-- SEARCH -->
                <div class="search-wrapper">

                    <div class="search-wrap">

                        <img
                            src="./assets/search.svg"
                            alt="search icon"
                            class="search-icon"
                        />

                        <input
                            type="text"
                            class="search-input body3-fonts"
                            placeholder="Search"
                            id="search-input"
                        />

                        <img
                            src="./assets/cross.svg"
                            alt="cross icon"
                            class="search-close-icon"
                            id="search-close-icon"
                        />

                    </div>

                    <!-- SORT -->
                    <div class="sort-wrapper">

                        <div class="sort-wrap">

                            <img
                                src="./assets/sorting.svg"
                                alt="sorting"
                                class="sort-icon"
                                id="sort-icon"
                            />

                        </div>

                        <div class="filter-wrapper">

                            <p class="body2-fonts">
                                Sort by:
                            </p>

                            <div class="filter-wrap">

                                <div>

                                    <!-- NUMBER -->
                                    <input
                                        type="radio"
                                        id="number"
                                        name="filters"
                                        value="number"
                                        checked
                                    />

                                    <label
                                        for="number"
                                        class="body3-fonts"
                                    >
                                        Number
                                    </label>

                                    <!-- NAME -->
                                    <input
                                        type="radio"
                                        id="name"
                                        name="filters"
                                        value="name"
                                    />

                                    <label
                                        for="name"
                                        class="body3-fonts"
                                    >
                                        Name
                                    </label>

                                </div>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </header>

        <!-- POKEMON LIST -->
        <section class="pokemon-list">

            <div class="container">

                <div class="list-wrapper"></div>

            </div>

        </section>

        <!-- NOT FOUND -->
        <div id="not-found-message">
            No Pokémon found.
        </div>

    </main>

</body>

</html>
